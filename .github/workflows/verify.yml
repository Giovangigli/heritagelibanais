name: Vérifications Studio
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/online/package-lock.json
      - run: npm --prefix apps/online run install:ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm --prefix apps/online run build
